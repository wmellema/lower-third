<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Inspector</title>
		<script type="module" src="./main.ts"></script>
	</head>
	<body>
		<aside class="inspector" data-graphic>
			<header class="head">
				<span class="tally-light"></span>
				<span class="kicker">Under the hood</span>
			</header>
			<h1 data-field="title">Runtime state</h1>

			<ol class="machine">
				<li data-node="idle"><b>idle</b><small>loaded</small></li>
				<li data-node="in"><b>in</b><small>animating</small></li>
				<li data-node="on"><b>on</b><small>on air</small></li>
				<li data-node="out"><b>out</b><small>animating</small></li>
			</ol>
			<p class="step kicker" data-field="$step"></p>

			<section class="block">
				<h2 class="kicker">Current data <span class="badge" data-field="$format">none</span></h2>
				<dl class="entries" data-list="$entries">
					<template><div><dt data-field="key"></dt><dd data-field="value"></dd></div></template>
				</dl>
			</section>

			<section class="block">
				<h2 class="kicker">Commands</h2>
				<ol class="log" data-list="$log">
					<template><li><time data-field="time"></time><b data-field="name"></b><span data-field="detail"></span></li></template>
				</ol>
			</section>

			<p class="note" data-field="note">This panel is a template too. It renders the events the runtime emits.</p>
		</aside>
	</body>
</html>
